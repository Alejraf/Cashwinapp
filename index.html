<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashReward - Ganhe Recompensas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-gem"></i> <span>CashReward</span>
            </div>
            <div class="user-balance">
                <i class="fa-solid fa-coins"></i> <span id="balance-amount">0.00</span> BRL
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <section class="welcome-card">
                <h2>Bem-vindo ao CashReward!</h2>
                <p>Responda pesquisas e complete ofertas para ganhar recompensas via Pix instantâneo.</p>
            </section>

            <!-- Offerwall Section -->
            <section class="offers-section">
                <h3><i class="fa-solid fa-clipboard-list"></i> Mural de Ofertas & Pesquisas</h3>
                <div class="offer-card" onclick="abrirMuroCPX()">
                    <div class="offer-icon"><i class="fa-solid fa-poll"></i></div>
                    <div class="offer-info">
                        <h4>CPX Research Pesquisas</h4>
                        <p>Ganhe até R$ 5,00 por pesquisa concluída.</p>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </section>

            <!-- Withdraw Section -->
            <section class="withdraw-section">
                <h3><i class="fa-solid fa-wallet"></i> Resgate via Pix</h3>
                <div class="withdraw-form">
                    <input type="text" id="pix-key" placeholder="Sua Chave Pix (CPF, E-mail, Tel)">
                    <input type="number" id="withdraw-amount" placeholder="Valor (R$)">
                    <button onclick="solicitarRetiro()">Resgatar Agora</button>
                </div>
            </section>
        </main>

        <!-- Footer Nav -->
        <nav class="bottom-nav">
            <a href="#" class="active"><i class="fa-solid fa-house"></i> Início</a>
            <a href="#" onclick="abrirMuroCPX()"><i class="fa-solid fa-gift"></i> Ofertas</a>
            <a href="#" onclick="alert('Histórico em breve')"><i class="fa-solid fa-history"></i> Histórico</a>
        </nav>
    </div>

    <script>
        const userId = 'user_' + Math.random().toString(36).substring(7);
        const CPX_APP_ID = 'TU_APP_ID'; // Reemplazar con tu ID real de CPX Research

        function actualizarBalance() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance-amount').innerText = data.balance.toFixed(2);
                });
        }

        function abrirMuroCPX() {
            const url = `https://offerwall.cpx-research.com/index.php?app_id=${CPX_APP_ID}&ext_user_id=${userId}`;
            window.open(url, '_blank');
        }

        function solicitarRetiro() {
            const pixKey = document.getElementById('pix-key').value;
            const amount = parseFloat(document.getElementById('withdraw-amount').value);

            if (!pixKey || !amount) {
                alert('Por favor preencha todos os campos.');
                return;
            }

            fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, pixKey, amount })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                actualizarBalance();
            });
        }

        setInterval(actualizarBalance, 5000);
        actualizarBalance();
    </script>
</body>
</html>
